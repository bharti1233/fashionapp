name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create local env from example
        # Unit/widget tests use mocks; placeholder values are enough.
        # Real credentials are never committed (see docs/BUILD-AND-CI.md).
        run: cp .env.example .env

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Android APK (debug)
        run: flutter build apk --debug -t lib/main_production.dart

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fashion-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
