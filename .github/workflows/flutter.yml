name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create local env from example
        # Unit/widget tests use mocks; placeholder values are enough.
        # Real credentials are never committed (see docs/BUILD-AND-CI.md).
        run: cp .env.example .env

      - name: Validate Supabase configuration
        # Fail early with a clear message instead of producing an APK that
        # hangs/fails on-device. Only emptiness is checked here — values are
        # NEVER printed (see step below for the YES-only confirmation).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL is missing. Set it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "SUPABASE_PUBLISHABLE_KEY is missing. Set it in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "SUPABASE_URL configured: YES"
          echo "SUPABASE_PUBLISHABLE_KEY configured: YES"
          echo "SUPABASE_URL shell variable configured: $([ -n "$SUPABASE_URL" ] && echo YES || echo NO)"
          echo "SUPABASE_PUBLISHABLE_KEY shell variable configured: $([ -n "$SUPABASE_PUBLISHABLE_KEY" ] && echo YES || echo NO)"

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Android APK (release)
        # Supabase config comes from repository secrets via build-time
        # defines. Secrets are mapped through env (never printed, logged,
        # or committed) and validated non-empty by the earlier step, so a
        # release APK can never again be built without configuration.
        # The production flavor is required (see android/app/build.gradle).
        # The APK is signed with the debug keystore (CI release APK);
        # Play Store production signing is a separate setup.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build apk --release --flavor production -t lib/main_production.dart
          --dart-define="SUPABASE_URL=$SUPABASE_URL"
          --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fashion-app-release-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk
