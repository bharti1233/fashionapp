name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create local env from example
        # Unit/widget tests use mocks; placeholder values are enough.
        # Real credentials are never committed (see docs/BUILD-AND-CI.md).
        run: cp .env.example .env

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Android APK (release)
        # Supabase config comes from repository secrets via build-time
        # defines. Secrets are never printed, logged, or committed.
        # The production flavor is required (see android/app/build.gradle).
        # The APK is signed with the debug keystore (CI release APK);
        # Play Store production signing is a separate setup.
        run: >
          flutter build apk --release --flavor production -t lib/main_production.dart
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fashion-app-release-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk
